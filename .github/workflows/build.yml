name: Build & Release Multi-Platform

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native:
    name: Build Native on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-latest
            artifact_name: radc-linux-x86_64
            archive_type: tar.gz
          - name: Windows (x86_64)
            os: windows-latest
            artifact_name: radc-windows-x86_64
            archive_type: zip
          - name: macOS (Universal - Apple Silicon & Intel)
            os: macos-latest
            artifact_name: radc-macos-universal
            archive_type: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Linux / Windows)
        if: runner.os != 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (macOS Universal)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Prepare Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package/${{ matrix.artifact_name }}
          cp build/radc package/${{ matrix.artifact_name }}/radc
          chmod +x package/${{ matrix.artifact_name }}/radc
          cp -r 580vnx package/${{ matrix.artifact_name }}/580vnx
          cp -r 991cnx_vf package/${{ matrix.artifact_name }}/991cnx_vf 2>/dev/null || true
          cp -r src/char_to_hex.json package/${{ matrix.artifact_name }}/char_to_hex.json
          cp run.sh package/${{ matrix.artifact_name }}/run.sh
          chmod +x package/${{ matrix.artifact_name }}/run.sh
          cp README.md LICENSE package/${{ matrix.artifact_name }}/
          mkdir -p package/${{ matrix.artifact_name }}/hex_ropchain
          mkdir -p package/${{ matrix.artifact_name }}/asm_ropchain
          
          cd package
          tar -czvf ../${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Prepare Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package\${{ matrix.artifact_name }} -Force
          if (Test-Path build\Release\radc.exe) {
            Copy-Item build\Release\radc.exe package\${{ matrix.artifact_name }}\radc.exe
          } elseif (Test-Path build\radc.exe) {
            Copy-Item build\radc.exe package\${{ matrix.artifact_name }}\radc.exe
          }
          Copy-Item -Recurse 580vnx package\${{ matrix.artifact_name }}\580vnx
          if (Test-Path 991cnx_vf) { Copy-Item -Recurse 991cnx_vf package\${{ matrix.artifact_name }}\991cnx_vf }
          Copy-Item src\char_to_hex.json package\${{ matrix.artifact_name }}\char_to_hex.json
          Copy-Item run.bat package\${{ matrix.artifact_name }}\run.bat
          Copy-Item README.md, LICENSE package\${{ matrix.artifact_name }}\
          New-Item -ItemType Directory -Path package\${{ matrix.artifact_name }}\hex_ropchain -Force
          New-Item -ItemType Directory -Path package\${{ matrix.artifact_name }}\asm_ropchain -Force
          
          Compress-Archive -Path package\${{ matrix.artifact_name }}\* -DestinationPath ${{ matrix.artifact_name }}.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_type }}
          if-no-files-found: error

  build-wasm:
    name: Build WebAssembly (WASM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten (emsdk)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build WebAssembly (WASM)
        run: |
          mkdir -p build_wasm
          em++ -O3 -std=c++17 src/*.cpp -o build_wasm/radc.js -s NODERAWFS=1

      - name: Package WebAssembly Artifact
        run: |
          mkdir -p package/radc-wasm
          cp -r build_wasm package/radc-wasm/
          cp -r 580vnx package/radc-wasm/580vnx
          cp -r 991cnx_vf package/radc-wasm/991cnx_vf 2>/dev/null || true
          cp -r src/char_to_hex.json package/radc-wasm/char_to_hex.json
          if [ -f test_wasm.html ]; then cp test_wasm.html package/radc-wasm/; fi
          cp README.md LICENSE package/radc-wasm/
          
          cd package
          tar -czvf ../radc-wasm.tar.gz radc-wasm

      - name: Upload WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: radc-wasm
          path: radc-wasm.tar.gz
          if-no-files-found: error

  release:
    name: Auto Publish GitHub Release
    needs: [build-native, build-wasm]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Flatten release assets
        run: |
          mkdir -p dist
          find release_assets -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Determine Tag and Release Name
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "release_name=RADC Decompiler $TAG_NAME" >> $GITHUB_OUTPUT
          else
            echo "tag_name=latest" >> $GITHUB_OUTPUT
            echo "release_name=RADC Decompiler - Latest Build" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
